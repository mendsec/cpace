version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - revive
    - gocyclo
    - misspell
    - gosec
  settings:
    gocyclo:
      min-complexity: 15
  exclusions:
    rules:
      # Tests may ignore errors from calls whose failure is the point.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
